<script>

(function(){
  const DATA = window.__DATA__;
  const TARGETS = DATA.targets;

  // ---------- Formatters ----------
  function fmtMoney(n, d=0) { if (n==null || isNaN(n)) return '—'; return '$'+Number(n).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d}); }
  function fmtNum(n, d=0) { if (n==null || isNaN(n)) return '—'; return Number(n).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d}); }
  function fmtPct(n, d=0) { if (n==null || isNaN(n)) return '—'; return (n*100).toFixed(d)+'%'; }
  function fmtRoas(n) { if (n==null || isNaN(n)) return '—'; return (n*100).toFixed(0)+'%'; }
  function roasClass(n) { if (n==null) return 'neutral'; if (n >= TARGETS.roas.stretch) return 'roas-good'; if (n >= TARGETS.roas.target) return 'roas-ok'; if (n >= TARGETS.roas.kill) return 'roas-warn'; return 'roas-bad'; }
  function deltaPct(curr, prev) { if (prev==null || prev==0) return null; if (curr==null) return null; return ((curr-prev)/prev)*100; }
  function deltaCell(curr, prev, inverse) {
    const d = deltaPct(curr, prev);
    if (d == null) return '<span class="card-delta neutral">·</span>';
    const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '·';
    const good = inverse ? d < 0 : d > 0;
    const cls = d === 0 ? 'neutral' : good ? 'up' : 'down';
    return '<span class="card-delta ' + cls + '">' + arrow + ' ' + (d>0?'+':'') + d.toFixed(0) + '%</span>';
  }

  // ---------- Render a single window (Daily / Weekly / Monthly) ----------
  function render(wKey, container) {
    const w = DATA[wKey];
    const t = w.totals;
    const p = w.prev;
    const dateRange = w.from === w.to ? w.from : (w.from + ' → ' + w.to);
    const prevRange = w.prevFrom === w.prevTo ? w.prevFrom : (w.prevFrom + ' → ' + w.prevTo);

    let html = '';
    html += '<div class="controls-row">';
    html += '<div><h2 style="margin:0;">' + w.label + ' report</h2><div class="sub">'+dateRange+' · vs '+prevRange+'</div></div>';
    html += '<div style="margin-left:auto;" class="actions">';
    html += '<button class="btn btn-pdf" data-export="pdf" data-window="'+wKey+'">⬇ Download PDF</button>';
    html += '<button class="btn btn-xlsx" data-export="xlsx" data-window="'+wKey+'">⬇ Download Excel</button>';
    html += '</div></div>';

    // Top metric cards
    html += '<div class="metrics">';
    html += metricCard('Spend',    fmtMoney(t.spend),    deltaCell(t.spend, p.spend), 'vs ' + fmtMoney(p.spend));
    html += metricCard('Revenue',  fmtMoney(t.revenue),  deltaCell(t.revenue, p.revenue), 'vs ' + fmtMoney(p.revenue));
    html += metricCard('ROAS',     fmtRoas(t.roas),      deltaCell(t.roas ?? 0, p.roas ?? 0), 'vs ' + fmtRoas(p.roas), roasClass(t.roas));
    html += metricCard('Deposits', fmtNum(t.deposits),   deltaCell(t.deposits, p.deposits), 'vs ' + fmtNum(p.deposits));
    html += metricCard('CPD',      t.cpd==null?'—':fmtMoney(t.cpd), deltaCell(t.cpd, p.cpd, true), 'vs ' + (p.cpd==null?'—':fmtMoney(p.cpd)));
    html += metricCard('Regs',     fmtNum(t.registrations), deltaCell(t.registrations, p.registrations), 'vs ' + fmtNum(p.registrations));
    html += metricCard('Clicks',   fmtNum(t.clicks),     deltaCell(t.clicks, p.clicks), 'vs ' + fmtNum(p.clicks));
    html += metricCard('CTR',      fmtPct(t.ctr,2),      deltaCell(t.ctr, p.ctr), 'vs ' + fmtPct(p.ctr,2));
    html += '</div>';

    // Brand breakdown
    html += '<div class="brands">';
    for (const code of ['BT','RB','K88']) {
      const b = w.byBrand.find(x => x.brand === code);
      const pb = (DATA[wKey].byBrand || []).find(x => x.brand === code); // current; for prev brand-level we don't have, just show current
      html += '<div class="brand-card"><span class="brand-stripe '+code+'"></span>';
      html += '<div class="brand-name '+code+'">'+brandName(code)+' · ' + code + '</div>';
      if (!b) {
        html += '<div class="brand-row"><span>No spend in this window</span></div>';
      } else {
        html += '<div class="brand-row">';
        html += '<span>Spend <b>'+fmtMoney(b.spend)+'</b></span>';
        html += '<span>Revenue <b>'+fmtMoney(b.revenue)+'</b></span>';
        html += '<span>ROAS <b class="'+roasClass(b.roas)+'">'+fmtRoas(b.roas)+'</b></span>';
        html += '<span>Dep <b>'+fmtNum(b.deposits)+'</b></span>';
        html += '<span>CPD <b>'+(b.cpd==null?'—':fmtMoney(b.cpd))+'</b></span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';

    // Sparkline (daily series for this window)
    if (w.series && w.series.length > 1) {
      html += '<div class="card" style="margin-bottom:16px;">';
      html += '<div class="card-label">Daily spend · ' + w.series.length + ' day series</div>';
      html += '<div class="sparkline">';
      const maxSpend = Math.max(1, ...w.series.map(s => s.spend));
      for (const s of w.series) {
        const h = Math.max(2, Math.round((s.spend / maxSpend) * 36));
        const cls = s.roas == null ? '' : s.roas >= TARGETS.roas.stretch ? 'good' : s.roas >= TARGETS.roas.target ? 'ok' : s.roas >= TARGETS.roas.kill ? 'warn' : 'bad';
        html += '<div class="spark-bar '+cls+'" style="height:'+h+'px" title="'+s.date+' · '+fmtMoney(s.spend)+' spend · ROAS '+fmtRoas(s.roas)+'"></div>';
      }
      html += '</div>';
      html += '<div class="legend"><span>'+w.series[0].date+'</span><span>spend bars · color = ROAS band</span><span>'+w.series[w.series.length-1].date+'</span></div>';
      html += '</div>';
    }

    // Campaign table
    html += '<div class="panel-section">';
    html += '<h2>Campaigns · ' + w.campaigns.length + ' active</h2>';
    if (w.campaigns.length === 0) {
      html += '<div class="card empty">No campaigns with spend in this window.</div>';
    } else {
      html += '<div style="overflow-x:auto;">';
      html += '<table id="tbl-'+wKey+'">';
      html += '<thead><tr>';
      html += '<th>Winrate</th><th>Brand</th><th>Campaign</th><th>Source</th><th>Status</th>';
      html += '<th class="num">Spend</th><th class="num">Revenue</th><th class="num">ROAS</th>';
      html += '<th class="num">Impr.</th><th class="num">Clicks</th><th class="num">CTR</th>';
      html += '<th class="num">Regs</th><th class="num">Dep</th><th class="num">CR</th><th class="num">CPD</th>';
      html += '</tr></thead><tbody>';
      for (const c of w.campaigns) {
        html += '<tr>';
        html += '<td><span class="verdict '+c.verdict+'">'+c.verdict+'</span></td>';
        html += '<td><span class="brand-pill '+c.brand+'">'+c.brand+'</span></td>';
        html += '<td><div class="name-cell mono" title="'+escAttr(c.name)+'">'+esc(c.name)+'</div></td>';
        html += '<td><span class="mono" style="color:var(--ink-dim);font-size:11px;">'+esc(c.traffic_source||'—')+'</span></td>';
        html += '<td><span class="mono" style="color:var(--ink-dim);font-size:11px;">'+esc(c.status||'—').replace(/_/g,' ')+'</span></td>';
        html += '<td class="num">'+fmtMoney(c.spend)+'</td>';
        html += '<td class="num">'+fmtMoney(c.revenue)+'</td>';
        html += '<td class="num '+roasClass(c.roas)+'">'+fmtRoas(c.roas)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtNum(c.impressions)+'</td>';
        html += '<td class="num">'+fmtNum(c.clicks)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtPct(c.ctr,2)+'</td>';
        html += '<td class="num">'+fmtNum(c.registrations)+'</td>';
        html += '<td class="num">'+fmtNum(c.deposits)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtPct(c.reg_to_dep,0)+'</td>';
        html += '<td class="num">'+(c.cpd==null?'—':fmtMoney(c.cpd))+'</td>';
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      // Verdict legend
      html += '<div class="legend" style="margin-top:8px;">';
      html += '<span><b class="verdict WIN">WIN</b> ROAS ≥ '+(TARGETS.roas.target*100)+'% + ≥1 deposit</span>';
      html += '<span><b class="verdict WATCH">WATCH</b> mixed signals</span>';
      html += '<span><b class="verdict FAIL">FAIL</b> ROAS &lt; '+(TARGETS.roas.kill*100)+'%</span>';
      html += '<span><b class="verdict GRACE">GRACE</b> spend &lt; $'+50+'</span>';
      html += '</div>';
    }
    html += '</div>';

    container.innerHTML = html;
  }

  function metricCard(label, value, delta, sub, valueClass) {
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;"><span class="card-label">'+label+'</span>'+delta+'</div><div class="card-value '+(valueClass||'')+'">'+value+'</div><div class="card-label" style="opacity:0.7;margin-top:2px;">'+sub+'</div></div>';
  }
  function brandName(code) { return code === 'BT' ? 'BigTaka' : code === 'RB' ? 'Rajabaji' : code === 'K88' ? 'Kyasino88' : code; }
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }

  // ---------- Tab switching ----------
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const w = t.dataset.window;
      document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
      document.getElementById('report-'+w).classList.add('active');
    });
  });

  // ---------- Export handlers ----------
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-export]');
    if (!btn) return;
    const type = btn.dataset.export;
    const wKey = btn.dataset.window;
    if (type === 'pdf') exportPdf(wKey);
    if (type === 'xlsx') exportXlsx(wKey);
  });

  async function exportPdf(wKey) {
    const node = document.getElementById('report-'+wKey);
    if (!node) return;
    const wasHidden = !node.classList.contains('active');
    if (wasHidden) node.style.display = 'block';
    try {
      const canvas = await html2canvas(node, { backgroundColor: '#0a0e1a', scale: 2 });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const imgW = pageW;
      const imgH = (canvas.height * imgW) / canvas.width;
      let y = 0;
      let remaining = imgH;
      while (remaining > 0) {
        pdf.addImage(imgData, 'PNG', 0, y, imgW, imgH);
        remaining -= pageH;
        if (remaining > 0) { pdf.addPage(); y -= pageH; }
      }
      pdf.save('d1ads-'+wKey+'-' + new Date().toISOString().slice(0,10) + '.pdf');
    } finally {
      if (wasHidden) node.style.display = '';
    }
  }

  function exportXlsx(wKey) {
    const w = DATA[wKey];
    const wb = XLSX.utils.book_new();

    // Sheet 1: Summary
    const summaryRows = [
      ['Report', w.label],
      ['Range', w.from + ' → ' + w.to],
      ['Compared to', w.prevFrom + ' → ' + w.prevTo],
      [],
      ['Metric', 'Current', 'Previous'],
      ['Spend',    w.totals.spend, w.prev.spend],
      ['Revenue',  w.totals.revenue, w.prev.revenue],
      ['ROAS',     w.totals.roas, w.prev.roas],
      ['Deposits', w.totals.deposits, w.prev.deposits],
      ['CPD',      w.totals.cpd, w.prev.cpd],
      ['Regs',     w.totals.registrations, w.prev.registrations],
      ['Clicks',   w.totals.clicks, w.prev.clicks],
      ['Impressions', w.totals.impressions, w.prev.impressions],
      ['CTR',      w.totals.ctr, w.prev.ctr],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');

    // Sheet 2: By brand
    const brandRows = [['Brand','Spend','Revenue','ROAS','Deposits','CPD','Regs','Clicks','Impressions','CTR']];
    for (const b of w.byBrand) {
      brandRows.push([b.brand, b.spend, b.revenue, b.roas, b.deposits, b.cpd, b.registrations, b.clicks, b.impressions, b.ctr]);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(brandRows), 'By Brand');

    // Sheet 3: Campaigns
    const campRows = [['Verdict','Brand','Campaign','Source','Status','Campaign ID','Spend','Revenue','ROAS','Impressions','Clicks','CTR','Regs','Deposits','Reg→Dep','CPD','CPA']];
    for (const c of w.campaigns) {
      campRows.push([
        c.verdict, c.brand, c.name, c.traffic_source||'', c.status||'', c.campaign_id||'',
        c.spend, c.revenue, c.roas, c.impressions, c.clicks, c.ctr, c.registrations, c.deposits, c.reg_to_dep, c.cpd, c.cpa
      ]);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(campRows), 'Campaigns');

    // Sheet 4: Daily series
    const seriesRows = [['Date','Spend','Revenue','ROAS','Deposits','Regs','Clicks','Impressions','CTR']];
    for (const s of (w.series||[])) {
      seriesRows.push([s.date, s.spend, s.revenue, s.roas, s.deposits, s.registrations, s.clicks, s.impressions, s.ctr]);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(seriesRows), 'Daily Series');

    XLSX.writeFile(wb, 'd1ads-'+wKey+'-' + new Date().toISOString().slice(0,10) + '.xlsx');
  }

  // ---------- Boot ----------
  render('daily',   document.getElementById('report-daily'));
  render('weekly',  document.getElementById('report-weekly'));
  render('monthly', document.getElementById('report-monthly'));
  document.getElementById('gen-at').textContent = new Date(DATA.generatedAt).toLocaleString();
  document.getElementById('sync-at').textContent = DATA.lastSync ? (DATA.lastSync.ran_at + ' (covering ' + DATA.lastSync.covered_date + ')') : '—';
})();

</script>
</body>
