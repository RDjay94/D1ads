  h1 { margin: 0; font-size: 18px; font-weight: 600; }

  .brand-tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .brand-tab { background: transparent; color: var(--ink-dim); border: 0; padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  .brand-tab.active[data-brand="ALL"] { background: rgba(167,139,250,0.18); color: var(--violet); }
  .brand-tab.active[data-brand="BT"] { background: rgba(249,115,22,0.18); color: var(--bt); }
  .brand-tab.active[data-brand="RB"] { background: rgba(157,225,52,0.18); color: var(--rb); }

  .brand-tab:hover:not(.active) { color: var(--ink); }

  .channel-filter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; }

  .channel-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel); border: 1px solid var(--border-2); color: var(--ink-dim); padding: 4px 9px 4px 7px; border-radius: 12px; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; user-select: none; transition: all 0.12s; }
  .channel-chip:hover { color: var(--ink); border-color: rgba(148,163,184,0.4); }
  .channel-chip input[type=checkbox] { margin: 0; accent-color: var(--sky); cursor: pointer; }
  .channel-chip.on { color: var(--ink); border-color: rgba(56,189,248,0.45); background: rgba(56,189,248,0.10); }

  .gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; }
  .gate-card { background: var(--panel); border: 1px solid var(--border-2); border-radius: 12px; padding: 28px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .gate-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }

  .gate-input:focus { outline: 2px solid var(--sky); outline-offset: -1px; }

  .gate-button:hover { background: #7dd3fc; }

  @media print {

<script>

(function(){
  const BOOT = window.__BOOT__;
  let DATA = null; // populated after unlock
  let TARGETS = null;

  // ---------- Password gate ----------
  const gateForm = document.getElementById('gate-form');
  const gatePwd = document.getElementById('gate-password');
  const gateErr = document.getElementById('gate-error');
  const gateBtn = gateForm.querySelector('button');

  function showGateError(msg) {
    gateErr.textContent = msg;
    gateErr.style.display = 'block';
  }
  function hideGateError() { gateErr.style.display = 'none'; }

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
    return await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64ToBytes(BOOT.crypto.salt), iterations: BOOT.crypto.iter, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function attemptUnlock(password) {
    const key = await deriveKey(password);
    const iv = b64ToBytes(BOOT.crypto.iv);
    const ct = b64ToBytes(BOOT.encrypted);
    try {
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      const text = new TextDecoder().decode(plain);
      return JSON.parse(text);
    } catch (e) {
      return null;
    }
  }

  gateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideGateError();
    gateBtn.disabled = true;
    gateBtn.textContent = 'Unlocking…';
    try {
      const data = await attemptUnlock(gatePwd.value);
      if (!data) {
        showGateError('Wrong password — try again.');
        gatePwd.select();
      } else {
        try { sessionStorage.setItem('d1ads_unlocked', gatePwd.value); } catch {}
        boot(data);
      }
    } catch (err) {
      showGateError('Decryption failed: ' + (err.message || err));
    } finally {
      gateBtn.disabled = false;
      gateBtn.textContent = 'Unlock';
    }
  });

  // Auto-unlock if user already entered password this session
  (async () => {
    try {
      const saved = sessionStorage.getItem('d1ads_unlocked');
      if (saved) {
        const data = await attemptUnlock(saved);
        if (data) boot(data);
      }
    } catch {}
  })();

  // ---------- Sign out ----------
  function bindSignOut() {
    document.getElementById('signout-btn').addEventListener('click', () => {
      try { sessionStorage.removeItem('d1ads_unlocked'); } catch {}
      location.reload();
    });
  }

  // ---------- Boot after successful unlock ----------
  function boot(data) {
    DATA = data;
    TARGETS = DATA.targets;
    campaignIndex = new Map(DATA.campaigns.map(c => [c.id, c]));
    initChannelsFromData();
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('gen-at').textContent = new Date(DATA.generatedAt).toLocaleString();
    document.getElementById('sync-at').textContent = DATA.lastSync ? (DATA.lastSync.ran_at + ' (covering ' + DATA.lastSync.covered_date + ')') : '—';
    bindSignOut();
    bindTabs();
    setCustomDefaults();
    render();
  }

  // ---------- Formatters ----------
  function fmtMoney(n, d=0) { if (n==null || isNaN(n)) return '—'; return '$'+Number(n).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d}); }
  function fmtNum(n, d=0) { if (n==null || isNaN(n)) return '—'; return Number(n).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d}); }
  function fmtPct(n, d=0) { if (n==null || isNaN(n)) return '—'; return (n*100).toFixed(d)+'%'; }
  function fmtRoas(n) { if (n==null || isNaN(n)) return '—'; return (n*100).toFixed(0)+'%'; }
  function roasClass(n) { if (n==null) return 'neutral'; if (n >= TARGETS.roas.stretch) return 'roas-good'; if (n >= TARGETS.roas.target) return 'roas-ok'; if (n >= TARGETS.roas.kill) return 'roas-warn'; return 'roas-bad'; }
  function deltaPct(curr, prev) { if (prev==null || prev==0) return null; if (curr==null) return null; return ((curr-prev)/prev)*100; }
  function deltaCell(curr, prev, inverse) {
    const d = deltaPct(curr, prev);
    if (d == null) return '<span class="card-delta neutral">·</span>';
    const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '·';
    const good = inverse ? d < 0 : d > 0;
    const cls = d === 0 ? 'neutral' : good ? 'up' : 'down';
    return '<span class="card-delta ' + cls + '">' + arrow + ' ' + (d>0?'+':'') + d.toFixed(0) + '%</span>';
  }
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }
  function brandName(code) { return code === 'BT' ? 'BigTaka' : code === 'RB' ? 'Rajabaji' : code === 'K88' ? 'Kyasino88' : code; }
  function isArchived(c) { return c.status === 'retired' || c.status === 'archived'; }

  // ---------- Date helpers ----------
  function ymd(d) {
    const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
  function startOfISOWeek(s) {
    const d = new Date(s + 'T12:00:00');
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - (day - 1));
    return ymd(d);
  }
  function firstOfMonth(s) {
    const d = new Date(s + 'T12:00:00');
    return ymd(new Date(d.getFullYear(), d.getMonth(), 1, 12));
  }
  function lastOfMonth(s) {
    const d = new Date(s + 'T12:00:00');
    return ymd(new Date(d.getFullYear(), d.getMonth()+1, 0, 12));
  }
  function rangeDays(from, to) {
    const out = [];
    for (let d = from; d <= to; d = addDays(d, 1)) out.push(d);
    return out;
  }
  function daysBetween(from, to) {
    const a = new Date(from + 'T12:00:00');
    const b = new Date(to + 'T12:00:00');
    return Math.round((b - a) / 86400000) + 1;
  }

  // ---------- Filtering & aggregation ----------
  let campaignIndex = null;
  function campaignById(cid) { return campaignIndex ? campaignIndex.get(cid) : null; }
  function rowsInRange(from, to, brand) {
    const channels = state.channels;
    const channelFilterActive = channels && channels.size > 0 && channels.size < state.allChannels.length;
    return DATA.rows.filter(r => {
      if (r.date < from || r.date > to) return false;
      if (brand !== 'ALL') {
        const c = campaignById(r.creative_id);
        if (!c || c.brand !== brand) return false;
      }
      if (channelFilterActive) {
        const c = campaignById(r.creative_id);
        const src = c && c.traffic_source ? c.traffic_source : '(none)';
        if (!channels.has(src)) return false;
      } else if (channels && channels.size === 0) {
        return false; // no channels selected → empty result
      }
      return true;
    });
  }
  function totalsOf(rs) {
    let spend=0, impressions=0, clicks=0, registrations=0, deposits=0, revenue=0;
    for (const r of rs) {
      spend += r.spend; impressions += r.impressions; clicks += r.clicks;
      registrations += r.registrations; deposits += r.deposits; revenue += r.revenue;
    }
    return {
      spend, impressions, clicks, registrations, deposits, revenue,
      ctr: impressions > 0 ? clicks/impressions : 0,
      cpa: registrations > 0 ? spend/registrations : null,
      cpd: deposits > 0 ? spend/deposits : null,
      roas: spend > 0 ? revenue/spend : null,
      reg_to_dep: registrations > 0 ? deposits/registrations : null,
    };
  }
  function groupByDate(rs) {
    const m = new Map();
    for (const r of rs) {
      const cur = m.get(r.date) || { date: r.date, spend:0, impressions:0, clicks:0, registrations:0, deposits:0, revenue:0 };
      cur.spend += r.spend; cur.impressions += r.impressions; cur.clicks += r.clicks;
      cur.registrations += r.registrations; cur.deposits += r.deposits; cur.revenue += r.revenue;
      m.set(r.date, cur);
    }
    const arr = Array.from(m.values()).sort((a,b) => a.date.localeCompare(b.date));
    return arr.map(r => ({ ...r, ...totalsOf([r]) }));
  }
  function groupByBrand(rs) {
    const m = new Map();
    for (const r of rs) {
      const c = campaignById(r.creative_id);
      if (!c) continue;
      const cur = m.get(c.brand) || { brand: c.brand, spend:0, impressions:0, clicks:0, registrations:0, deposits:0, revenue:0 };
      cur.spend += r.spend; cur.impressions += r.impressions; cur.clicks += r.clicks;
      cur.registrations += r.registrations; cur.deposits += r.deposits; cur.revenue += r.revenue;
      m.set(c.brand, cur);
    }
    return Array.from(m.values()).map(r => ({ ...r, ...totalsOf([r]) }));
  }
  function groupByCampaign(rs) {
    const m = new Map();
    for (const r of rs) {
      const cur = m.get(r.creative_id) || { creative_id: r.creative_id, spend:0, impressions:0, clicks:0, registrations:0, deposits:0, revenue:0 };
      cur.spend += r.spend; cur.impressions += r.impressions; cur.clicks += r.clicks;
      cur.registrations += r.registrations; cur.deposits += r.deposits; cur.revenue += r.revenue;
      m.set(r.creative_id, cur);
    }
    const out = [];
    for (const v of m.values()) {
      const c = campaignById(v.creative_id);
      if (!c) continue;
      const t = totalsOf([v]);
      if (v.spend === 0 && v.revenue === 0 && v.deposits === 0) continue;
      out.push({
        ...c, ...t,
        verdict: verdictOf(t.spend, t.roas, t.deposits),
      });
    }
    return out.sort((a,b) => b.spend - a.spend);
  }
  function verdictOf(spend, roas, deposits) {
    if (spend < DATA.graceSpend) return 'GRACE';
    if (roas != null && roas >= TARGETS.roas.target && deposits >= 1) return 'WIN';
    if (roas != null && roas < TARGETS.roas.kill) return 'FAIL';
    return 'WATCH';
  }

  // ---------- State ----------
  const CHANNEL_ORDER = ['Kadam','RichAds','Adsterra','PropellerAds','Meta','Telegram'];
  let state = {
    window: 'channels',
    brand: 'ALL',
    customFrom: null,
    customTo: null,
    channelsMonth: null, // 'YYYY-MM'
    showCampaigns: false,
    channels: new Set(),
    allChannels: [],
  };
  // Populated once DATA is decrypted (inside boot)
  function initChannelsFromData() {
    const set = new Set();
    for (const c of DATA.campaigns) set.add(c.traffic_source || '(none)');
    state.allChannels = Array.from(set).sort((a, b) => {
      const ai = CHANNEL_ORDER.indexOf(a); const bi = CHANNEL_ORDER.indexOf(b);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return a.localeCompare(b);
    });
    state.channels = new Set(state.allChannels);
  }

  function currentRange() {
    const today = DATA.endDate;
    const yest = DATA.yesterday;
    if (state.window === 'daily') {
      const from = yest, to = yest;
      const prevFrom = addDays(yest, -1), prevTo = addDays(yest, -1);
      const seriesFrom = addDays(yest, -6);
      return { from, to, prevFrom, prevTo, seriesFrom, seriesTo: yest, label: 'Daily' };
    }
    if (state.window === 'weekly') {
      const from = startOfISOWeek(today);
      const to = addDays(from, 6);
      const prevFrom = addDays(from, -7), prevTo = addDays(from, -1);
      return { from, to, prevFrom, prevTo, seriesFrom: from, seriesTo: to, label: 'Weekly' };
    }
    if (state.window === 'monthly') {
      const from = firstOfMonth(today);
      const to = lastOfMonth(today);
      const prevFromBase = firstOfMonth(addDays(from, -1));
      const prevFrom = prevFromBase, prevTo = lastOfMonth(prevFromBase);
      return { from, to, prevFrom, prevTo, seriesFrom: from, seriesTo: to, label: 'Monthly' };
    }
    // custom
    const from = state.customFrom || DATA.startDate;
    const to = state.customTo || yest;
    const span = daysBetween(from, to);
    const prevTo = addDays(from, -1);
    const prevFrom = addDays(prevTo, -(span - 1));
    return { from, to, prevFrom, prevTo, seriesFrom: from, seriesTo: to, label: 'Custom' };
  }

  // ---------- Channels view helpers ----------
  function monthsBetween(minDate, maxDate) {
    // returns array of {ym, label, year, month}
    const out = [];
    const [y0, m0] = minDate.slice(0,7).split('-').map(Number);
    const [y1, m1] = maxDate.slice(0,7).split('-').map(Number);
    let y = y0, m = m0;
    while (y < y1 || (y === y1 && m <= m1)) {
      out.push({
        ym: y + '-' + String(m).padStart(2,'0'),
        year: y, month: m,
        label: new Date(y, m-1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' }),
      });
      m++; if (m > 12) { m = 1; y++; }
    }
    return out;
  }
  function weeksOfMonth(year, month) {
    // [1-7], [8-14], [15-21], [22-end] (4 chunks always)
    const last = new Date(year, month, 0).getDate();
    const mm = String(month).padStart(2,'0');
    const yyyy = String(year);
    function d(day) { return yyyy + '-' + mm + '-' + String(day).padStart(2,'0'); }
    return [
      { num: 1, from: d(1),  to: d(Math.min(7, last)) },
      { num: 2, from: d(8),  to: d(Math.min(14, last)) },
      { num: 3, from: d(15), to: d(Math.min(21, last)) },
      { num: 4, from: d(22), to: d(last) },
    ].filter(w => w.from.slice(-2) <= String(last).padStart(2,'0'));
  }
  function brandCountry(b) { return b === 'K88' ? 'NP' : b === 'BT' || b === 'RB' ? 'BD' : '—'; }
  function monthShort(month) { return ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][month-1]; }

  // ---------- Render dispatch ----------
  function render() {
    if (state.window === 'channels') return renderChannels();
    return renderStandard();
  }

  // ---------- Channels view (first tab) ----------
  function renderChannels() {
    const ym = state.channelsMonth || DATA.endDate.slice(0,7);
    const [year, month] = ym.split('-').map(Number);
    const weeks = weeksOfMonth(year, month);
    const monthStart = ym + '-01';
    const monthEnd = weeks[weeks.length-1].to;
    const mShort = monthShort(month);
    const brandLabel = state.brand === 'ALL' ? 'ALL' : state.brand;
    const countryLabel = state.brand === 'ALL' ? 'BD,NP' : brandCountry(state.brand);

    // Get distinct traffic_sources that had activity this month under the brand filter
    const monthRows = rowsInRange(monthStart, monthEnd, state.brand);
    const channelSet = new Set();
    for (const r of monthRows) {
      const c = campaignById(r.creative_id);
      if (c && c.traffic_source) channelSet.add(c.traffic_source);
    }
    const channels = Array.from(channelSet).sort();

    // Build per-channel weekly totals
    const channelData = channels.map(ch => {
      const wks = weeks.map(w => {
        const rs = rowsInRange(w.from, w.to, state.brand).filter(r => {
          const c = campaignById(r.creative_id);
          return c && c.traffic_source === ch;
        });
        return { week: w, totals: totalsOf(rs) };
      });
      const sum = totalsOf(rs_flatten(wks));
      return { channel: ch, weeks: wks, sum };
    });
    function rs_flatten(wks) {
      // Re-aggregate from week sums (simpler than re-filtering)
      const fake = wks.map(w => ({
        date: w.week.from, creative_id: 0,
        spend: w.totals.spend, impressions: w.totals.impressions, clicks: w.totals.clicks,
        registrations: w.totals.registrations, deposits: w.totals.deposits, revenue: w.totals.revenue,
      }));
      return fake;
    }

    // Grand totals across all channels for the month
    const grand = totalsOf(monthRows);

    let html = '';
    html += '<div class="controls-row">';
    html += '<div><h2 style="margin:0;">Channels · ' + brandName(state.brand) + (state.brand === 'ALL' ? ' brands' : '') + '</h2>';
    html += '<div class="sub">' + (new Date(year, month-1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric' }) + ' · weekly breakdown by traffic channel · ' + monthStart + ' to ' + monthEnd + '</div></div>';
    html += '<div style="margin-left:auto;" class="actions">';
    html += '<button class="btn btn-pdf" data-export="pdf">⬇ Download PDF</button>';
    html += '<button class="btn btn-xlsx" data-export="xlsx">⬇ Download Excel</button>';
    html += '</div></div>';

    if (channels.length === 0) {
      html += '<div class="card empty">No campaigns with activity in ' + ym + ' for ' + brandName(state.brand) + '.</div>';
      document.getElementById('report').innerHTML = html;
      return;
    }

    // Month banner (matching the reference's "June2025" highlight)
    html += '<table style="margin-bottom:0;">';
    html += '<thead><tr>';
    html += '<th>Channel</th><th>Brand</th><th>Country</th>';
    html += '<th class="num">Spend (USD)</th><th class="num">New Register</th><th class="num">Weekly New_FTD</th>';
    html += '<th class="num">CPR</th><th class="num">CPD</th><th class="num">Reg2Dep</th>';
    html += '</tr></thead><tbody>';

    // Highlight month banner row
    html += '<tr><td colspan="9" style="background:rgba(251,191,36,0.18); color:var(--amber); font-weight:700; padding:6px 10px; text-transform:uppercase; letter-spacing:0.05em; font-size:12px;">' + (new Date(year, month-1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric' }) + '</td></tr>';

    for (const cd of channelData) {
      // Per-week rows for this channel
      for (const wk of cd.weeks) {
        const t = wk.totals;
        const cpr = t.cpa; // cost per registration
        html += '<tr>';
        html += '<td class="mono">' + mShort + '_Week ' + wk.week.num + '_' + esc(cd.channel) + '</td>';
        html += '<td><span class="brand-pill ' + (state.brand === 'ALL' ? '' : state.brand) + '">' + brandLabel + '</span></td>';
        html += '<td class="mono" style="color:var(--ink-dim);font-size:11px;">' + countryLabel + '</td>';
        html += '<td class="num">' + fmtMoney(t.spend, 2) + '</td>';
        html += '<td class="num">' + fmtNum(t.registrations) + '</td>';
        html += '<td class="num">' + fmtNum(t.deposits) + '</td>';
        html += '<td class="num">' + (cpr==null ? '—' : fmtMoney(cpr, 2)) + '</td>';
        html += '<td class="num">' + (t.cpd==null ? '—' : fmtMoney(t.cpd, 2)) + '</td>';
        html += '<td class="num">' + fmtPct(t.reg_to_dep, 2) + '</td>';
        html += '</tr>';

        // Per-campaign drill-down rows for this week (when toggle is on)
        if (state.showCampaigns) {
          const wkRows = rowsInRange(wk.week.from, wk.week.to, state.brand).filter(r => {
            const c = campaignById(r.creative_id);
            return c && c.traffic_source === cd.channel;
          });
          const camps = groupByCampaign(wkRows);
          for (const c of camps) {
            const archived = isArchived(c);
            html += '<tr style="background:rgba(148,163,184,0.03);' + (archived ? 'opacity:0.55;' : '') + '">';
            html += '<td style="padding-left:24px;" class="mono" title="' + escAttr(c.name) + '"><span style="color:var(--ink-faint);">↳</span> <span style="color:var(--ink-dim);font-size:11.5px;">' + esc(c.name) + '</span>' + (archived?' <span style="color:var(--ink-faint);font-size:10px;">[archived]</span>':'') + '</td>';
            html += '<td><span class="brand-pill ' + c.brand + '">' + c.brand + '</span></td>';
            html += '<td class="mono" style="color:var(--ink-dim);font-size:11px;">' + brandCountry(c.brand) + '</td>';
            html += '<td class="num">' + fmtMoney(c.spend, 2) + '</td>';
            html += '<td class="num">' + fmtNum(c.registrations) + '</td>';
            html += '<td class="num">' + fmtNum(c.deposits) + '</td>';
            html += '<td class="num">' + (c.cpa==null ? '—' : fmtMoney(c.cpa, 2)) + '</td>';
            html += '<td class="num">' + (c.cpd==null ? '—' : fmtMoney(c.cpd, 2)) + '</td>';
            html += '<td class="num">' + fmtPct(c.reg_to_dep, 2) + '</td>';
            html += '</tr>';
          }
          if (camps.length === 0 && wk.totals.spend > 0) {
            html += '<tr style="background:rgba(148,163,184,0.03);"><td colspan="9" style="padding-left:24px;color:var(--ink-faint);font-size:11px;">↳ rollup data only (no per-campaign breakdown)</td></tr>';
          }
        }
      }
      // Channel subtotal
      const s = cd.sum;
      html += '<tr class="channel-total-row">';
      html += '<td class="mono">↳ ' + esc(cd.channel) + ' subtotal</td>';
      html += '<td>—</td><td>—</td>';
      html += '<td class="num">' + fmtMoney(s.spend, 2) + '</td>';
      html += '<td class="num">' + fmtNum(s.registrations) + '</td>';
      html += '<td class="num">' + fmtNum(s.deposits) + '</td>';
      html += '<td class="num">' + (s.cpa==null ? '—' : fmtMoney(s.cpa, 2)) + '</td>';
      html += '<td class="num">' + (s.cpd==null ? '—' : fmtMoney(s.cpd, 2)) + '</td>';
      html += '<td class="num">' + fmtPct(s.reg_to_dep, 2) + '</td>';
      html += '</tr>';
      // Spacer row
      html += '<tr><td colspan="9" style="padding:4px;background:transparent;border:0;"></td></tr>';
    }

    // Grand total
    html += '<tr class="channel-grand-row">';
    html += '<td>TOTAL · ' + (new Date(year, month-1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric' }) + '</td>';
    html += '<td>' + brandLabel + '</td>';
    html += '<td>' + countryLabel + '</td>';
    html += '<td class="num">' + fmtMoney(grand.spend, 2) + '</td>';
    html += '<td class="num">' + fmtNum(grand.registrations) + '</td>';
    html += '<td class="num">' + fmtNum(grand.deposits) + '</td>';
    html += '<td class="num">' + (grand.cpa==null ? '—' : fmtMoney(grand.cpa, 2)) + '</td>';
    html += '<td class="num">' + (grand.cpd==null ? '—' : fmtMoney(grand.cpd, 2)) + '</td>';
    html += '<td class="num">' + fmtPct(grand.reg_to_dep, 2) + '</td>';
    html += '</tr>';

    html += '</tbody></table>';

    html += '<div class="legend" style="margin-top:8px;">';
    html += '<span><b>CPR</b> = Spend ÷ New Register</span>';
    html += '<span><b>CPD</b> = Spend ÷ Weekly New_FTD (first-time deposits)</span>';
    html += '<span><b>Reg2Dep</b> = Deposits ÷ Registrations</span>';
    html += '<span style="color:var(--ink-faint);">Week 1 = days 1-7 · Week 2 = 8-14 · Week 3 = 15-21 · Week 4 = 22-end</span>';
    html += '</div>';

    document.getElementById('report').innerHTML = html;
  }

  // ---------- Standard view (Daily / Weekly / Monthly / Custom) ----------
  function renderStandard() {
    const r = currentRange();
    // clamp to available
    const seriesFrom = r.seriesFrom < DATA.startDate ? DATA.startDate : r.seriesFrom;
    const cur = rowsInRange(r.from, r.to, state.brand);
    const prev = rowsInRange(r.prevFrom, r.prevTo, state.brand);
    const totals = totalsOf(cur);
    const prevTotals = totalsOf(prev);
    const byBrand = groupByBrand(cur);
    const byCampaign = groupByCampaign(cur);
    const seriesRows = rowsInRange(seriesFrom, r.seriesTo, state.brand);
    const series = groupByDate(seriesRows);

    let html = '';
    html += '<div class="controls-row">';
    html += '<div><h2 style="margin:0;">' + r.label + ' · ' + brandName(state.brand) + (state.brand !== 'ALL' ? '' : ' brands') + '</h2>';
    html += '<div class="sub">' + r.from + ' → ' + r.to + ' (' + daysBetween(r.from, r.to) + ' day' + (daysBetween(r.from, r.to)===1?'':'s') + ') · vs ' + r.prevFrom + ' → ' + r.prevTo + '</div></div>';
    html += '<div style="margin-left:auto;" class="actions">';
    html += '<button class="btn btn-pdf" data-export="pdf">⬇ Download PDF</button>';
    html += '<button class="btn btn-xlsx" data-export="xlsx">⬇ Download Excel</button>';
    html += '</div></div>';

    // Top metric cards
    html += '<div class="metrics">';
    html += metricCard('Spend',    fmtMoney(totals.spend),    deltaCell(totals.spend, prevTotals.spend), 'vs ' + fmtMoney(prevTotals.spend));
    html += metricCard('Revenue',  fmtMoney(totals.revenue),  deltaCell(totals.revenue, prevTotals.revenue), 'vs ' + fmtMoney(prevTotals.revenue));
    html += metricCard('ROAS',     fmtRoas(totals.roas),      deltaCell(totals.roas ?? 0, prevTotals.roas ?? 0), 'vs ' + fmtRoas(prevTotals.roas), roasClass(totals.roas));
    html += metricCard('Deposits', fmtNum(totals.deposits),   deltaCell(totals.deposits, prevTotals.deposits), 'vs ' + fmtNum(prevTotals.deposits));
    html += metricCard('CPD',      totals.cpd==null?'—':fmtMoney(totals.cpd), deltaCell(totals.cpd, prevTotals.cpd, true), 'vs ' + (prevTotals.cpd==null?'—':fmtMoney(prevTotals.cpd)));
    html += metricCard('Regs',     fmtNum(totals.registrations), deltaCell(totals.registrations, prevTotals.registrations), 'vs ' + fmtNum(prevTotals.registrations));
    html += metricCard('Clicks',   fmtNum(totals.clicks),     deltaCell(totals.clicks, prevTotals.clicks), 'vs ' + fmtNum(prevTotals.clicks));
    html += metricCard('CTR',      fmtPct(totals.ctr,2),      deltaCell(totals.ctr, prevTotals.ctr), 'vs ' + fmtPct(prevTotals.ctr,2));
    html += '</div>';

    // Brand breakdown — only when ALL brands selected
    if (state.brand === 'ALL') {
      html += '<div class="brands">';
      for (const code of ['BT','RB','K88']) {
        const b = byBrand.find(x => x.brand === code);
        html += '<div class="brand-card"><span class="brand-stripe '+code+'"></span>';
        html += '<div class="brand-name '+code+'">'+brandName(code)+' · ' + code + '</div>';
        if (!b) {
          html += '<div class="brand-row"><span>No spend in this window</span></div>';
        } else {
          html += '<div class="brand-row">';
          html += '<span>Spend <b>'+fmtMoney(b.spend)+'</b></span>';
          html += '<span>Revenue <b>'+fmtMoney(b.revenue)+'</b></span>';
          html += '<span>ROAS <b class="'+roasClass(b.roas)+'">'+fmtRoas(b.roas)+'</b></span>';
          html += '<span>Dep <b>'+fmtNum(b.deposits)+'</b></span>';
          html += '<span>CPD <b>'+(b.cpd==null?'—':fmtMoney(b.cpd))+'</b></span>';
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    // Sparkline
    if (series.length > 1) {
      html += '<div class="card" style="margin-bottom:16px;">';
      html += '<div class="card-label">Daily spend · ' + series.length + ' day series</div>';
      html += '<div class="sparkline">';
      const maxSpend = Math.max(1, ...series.map(s => s.spend));
      for (const s of series) {
        const h = Math.max(2, Math.round((s.spend / maxSpend) * 36));
        const cls = s.roas == null ? '' : s.roas >= TARGETS.roas.stretch ? 'good' : s.roas >= TARGETS.roas.target ? 'ok' : s.roas >= TARGETS.roas.kill ? 'warn' : 'bad';
        html += '<div class="spark-bar '+cls+'" style="height:'+h+'px" title="'+s.date+' · '+fmtMoney(s.spend)+' spend · ROAS '+fmtRoas(s.roas)+'"></div>';
      }
      html += '</div>';
      html += '<div class="legend"><span>'+series[0].date+'</span><span>spend bars · color = ROAS band</span><span>'+series[series.length-1].date+'</span></div>';
      html += '</div>';
    }

    // Campaign table
    html += '<div class="panel-section">';
    html += '<h2>Campaigns · ' + byCampaign.length + ' with activity</h2>';
    if (byCampaign.length === 0) {
      html += '<div class="card empty">No campaigns with spend in this window.</div>';
    } else {
      html += '<div style="overflow-x:auto;">';
      html += '<table>';
      html += '<thead><tr>';
      html += '<th>Winrate</th><th>Brand</th><th>Campaign</th><th>Source</th><th>Status</th>';
      html += '<th class="num">Spend</th><th class="num">Revenue</th><th class="num">ROAS</th>';
      html += '<th class="num">Impr.</th><th class="num">Clicks</th><th class="num">CTR</th>';
      html += '<th class="num">Regs</th><th class="num">Dep</th><th class="num">CR</th><th class="num">CPD</th>';
      html += '</tr></thead><tbody>';
      for (const c of byCampaign) {
        const archived = isArchived(c);
        html += '<tr' + (archived ? ' class="archived"' : '') + '>';
        html += '<td><span class="verdict '+c.verdict+'">'+c.verdict+'</span></td>';
        html += '<td><span class="brand-pill '+c.brand+'">'+c.brand+'</span></td>';
        html += '<td><div class="name-cell mono" title="'+escAttr(c.name)+'">'+esc(c.name)+(archived?' <span style="color:var(--ink-faint);font-size:10px;">[archived]</span>':'')+'</div></td>';
        html += '<td><span class="mono" style="color:var(--ink-dim);font-size:11px;">'+esc(c.traffic_source||'—')+'</span></td>';
        html += '<td><span class="mono" style="color:var(--ink-dim);font-size:11px;">'+esc(c.status||'—').replace(/_/g,' ')+'</span></td>';
        html += '<td class="num">'+fmtMoney(c.spend)+'</td>';
        html += '<td class="num">'+fmtMoney(c.revenue)+'</td>';
        html += '<td class="num '+roasClass(c.roas)+'">'+fmtRoas(c.roas)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtNum(c.impressions)+'</td>';
        html += '<td class="num">'+fmtNum(c.clicks)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtPct(c.ctr,2)+'</td>';
        html += '<td class="num">'+fmtNum(c.registrations)+'</td>';
        html += '<td class="num">'+fmtNum(c.deposits)+'</td>';
        html += '<td class="num" style="color:var(--ink-dim);">'+fmtPct(c.reg_to_dep,0)+'</td>';
        html += '<td class="num">'+(c.cpd==null?'—':fmtMoney(c.cpd))+'</td>';
        html += '</tr>';
      }
      // Grand-total row across every campaign in this view
      html += '<tr class="channel-grand-row">';
      html += '<td colspan="3">TOTAL · ' + byCampaign.length + ' campaign' + (byCampaign.length===1?'':'s') + '</td>';
      html += '<td colspan="2" style="color:var(--ink-dim);font-size:11px;">' + brandName(state.brand) + (state.brand==='ALL'?' brands':'') + ' · ' + r.from + ' → ' + r.to + '</td>';
      html += '<td class="num">'+fmtMoney(totals.spend)+'</td>';
      html += '<td class="num">'+fmtMoney(totals.revenue)+'</td>';
      html += '<td class="num '+roasClass(totals.roas)+'">'+fmtRoas(totals.roas)+'</td>';
      html += '<td class="num">'+fmtNum(totals.impressions)+'</td>';
      html += '<td class="num">'+fmtNum(totals.clicks)+'</td>';
      html += '<td class="num">'+fmtPct(totals.ctr,2)+'</td>';
      html += '<td class="num">'+fmtNum(totals.registrations)+'</td>';
      html += '<td class="num">'+fmtNum(totals.deposits)+'</td>';
      html += '<td class="num">'+fmtPct(totals.reg_to_dep,0)+'</td>';
      html += '<td class="num">'+(totals.cpd==null?'—':fmtMoney(totals.cpd))+'</td>';
      html += '</tr>';
      html += '</tbody></table></div>';
      html += '<div class="legend" style="margin-top:8px;">';
      html += '<span><b class="verdict WIN">WIN</b> ROAS ≥ '+(TARGETS.roas.target*100)+'% + ≥1 deposit</span>';
      html += '<span><b class="verdict WATCH">WATCH</b> mixed signals</span>';
      html += '<span><b class="verdict FAIL">FAIL</b> ROAS &lt; '+(TARGETS.roas.kill*100)+'%</span>';
      html += '<span><b class="verdict GRACE">GRACE</b> spend &lt; $'+DATA.graceSpend+'</span>';
      html += '<span style="opacity:0.6;">Archived campaigns shown dimmed.</span>';
      html += '</div>';
    }
    html += '</div>';

    document.getElementById('report').innerHTML = html;
  }

  function metricCard(label, value, delta, sub, valueClass) {
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;"><span class="card-label">'+label+'</span>'+delta+'</div><div class="card-value '+(valueClass||'')+'">'+value+'</div><div class="card-label" style="opacity:0.7;margin-top:2px;">'+sub+'</div></div>';
  }

  // ---------- Tabs + controls ----------
  function bindTabs() {
    document.querySelectorAll('#window-tabs .tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('#window-tabs .tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.window = t.dataset.window;
        document.getElementById('custom-pickers').style.display = state.window === 'custom' ? 'flex' : 'none';
        document.getElementById('channels-pickers').style.display = state.window === 'channels' ? 'flex' : 'none';
        render();
      });
    });
    // Populate month dropdown for Channels tab
    const monthSelect = document.getElementById('channels-month');
    const months = monthsBetween(DATA.startDate, DATA.endDate);
    monthSelect.innerHTML = months.map(m => '<option value="' + m.ym + '">' + m.label + '</option>').join('');
    const defaultMonth = state.channelsMonth || DATA.endDate.slice(0,7);
    state.channelsMonth = defaultMonth;
    monthSelect.value = defaultMonth;
    monthSelect.addEventListener('change', (e) => { state.channelsMonth = e.target.value; render(); });
    document.getElementById('show-campaigns').addEventListener('change', (e) => { state.showCampaigns = e.target.checked; render(); });

    // ---- Channel filter chips ----
    function renderChannelChips() {
      const wrap = document.getElementById('channel-chips');
      wrap.innerHTML = state.allChannels.map(ch => {
        const on = state.channels.has(ch);
        const label = ch === '(none)' ? 'Unassigned' : ch;
        return '<label class="channel-chip ' + (on ? 'on' : '') + '" data-channel="' + ch + '">'
          + '<input type="checkbox" data-channel-cb="' + ch + '"' + (on ? ' checked' : '') + ' />'
          + label
          + '</label>';
      }).join('');
      wrap.querySelectorAll('input[data-channel-cb]').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const ch = e.target.dataset.channelCb;
          if (e.target.checked) state.channels.add(ch);
          else state.channels.delete(ch);
          renderChannelChips();
          render();
        });
      });
    }
    renderChannelChips();
    document.querySelectorAll('[data-channel-quick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.channelQuick === 'all') state.channels = new Set(state.allChannels);
        else if (btn.dataset.channelQuick === 'none') state.channels = new Set();
        renderChannelChips();
        render();
      });
    });

    document.querySelectorAll('#brand-tabs .brand-tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('#brand-tabs .brand-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        state.brand = t.dataset.brand;
        render();
      });
    });
    document.getElementById('custom-from').addEventListener('change', (e) => { state.customFrom = e.target.value; render(); });
    document.getElementById('custom-to').addEventListener('change', (e) => { state.customTo = e.target.value; render(); });
    document.querySelectorAll('.preset').forEach(p => {
      p.addEventListener('click', () => {
        const today = DATA.endDate;
        const yest = DATA.yesterday;
        let from, to;
        if (p.dataset.preset === '7d')  { from = addDays(yest, -6); to = yest; }
        else if (p.dataset.preset === '30d') { from = addDays(yest, -29); to = yest; }
        else if (p.dataset.preset === '90d') { from = addDays(yest, -89); to = yest; }
        else if (p.dataset.preset === 'ytd') { from = '2026-01-01'; to = yest; }
        else if (p.dataset.preset === 'all') { from = DATA.startDate; to = yest; }
        if (from < DATA.startDate) from = DATA.startDate;
        state.customFrom = from; state.customTo = to;
        document.getElementById('custom-from').value = from;
        document.getElementById('custom-to').value = to;
        render();
      });
    });

    // Export buttons (delegated via document because they're inside #report)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-export]');
      if (!btn) return;
      if (btn.dataset.export === 'pdf') exportPdf();
      if (btn.dataset.export === 'xlsx') exportXlsx();
    });
  }

  function setCustomDefaults() {
    const fromInput = document.getElementById('custom-from');
    const toInput = document.getElementById('custom-to');
    fromInput.min = DATA.startDate;
    fromInput.max = DATA.endDate;
    toInput.min = DATA.startDate;
    toInput.max = DATA.endDate;
    if (!state.customFrom) state.customFrom = addDays(DATA.yesterday, -29);
    if (!state.customTo) state.customTo = DATA.yesterday;
    if (state.customFrom < DATA.startDate) state.customFrom = DATA.startDate;
    fromInput.value = state.customFrom;
    toInput.value = state.customTo;
  }

  // ---------- Export PDF / Excel ----------
  async function exportPdf() {
    const node = document.getElementById('report');
    if (!node) return;
    try {
      const canvas = await html2canvas(node, { backgroundColor: '#0a0e1a', scale: 2 });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const imgW = pageW;
      const imgH = (canvas.height * imgW) / canvas.width;
      let y = 0;
      let remaining = imgH;
      while (remaining > 0) {
        pdf.addImage(imgData, 'PNG', 0, y, imgW, imgH);
        remaining -= pageH;
        if (remaining > 0) { pdf.addPage(); y -= pageH; }
      }
      let filename;
      if (state.window === 'channels') {
        filename = 'd1ads-channels-' + state.brand + '-' + state.channelsMonth + '.pdf';
      } else {
        const r = currentRange();
        filename = 'd1ads-'+r.label.toLowerCase()+'-'+state.brand+'-' + r.from + '_to_' + r.to + '.pdf';
      }
      pdf.save(filename);
    } catch (e) {
      alert('PDF export failed: ' + e.message);
    }
  }

  function exportXlsx() {
    if (state.window === 'channels') return exportChannelsXlsx();
    const r = currentRange();
    const cur = rowsInRange(r.from, r.to, state.brand);
    const prev = rowsInRange(r.prevFrom, r.prevTo, state.brand);
    const totals = totalsOf(cur);
    const prevTotals = totalsOf(prev);
    const byBrand = groupByBrand(cur);
    const byCampaign = groupByCampaign(cur);
    const series = groupByDate(rowsInRange(r.seriesFrom, r.seriesTo, state.brand));

    const wb = XLSX.utils.book_new();

    const summary = [
      ['Report', r.label],
      ['Brand', state.brand],
      ['Range', r.from + ' to ' + r.to],
      ['Compared to', r.prevFrom + ' to ' + r.prevTo],
      [],
      ['Metric', 'Current', 'Previous'],
      ['Spend',        totals.spend,         prevTotals.spend],
      ['Revenue',      totals.revenue,       prevTotals.revenue],
      ['ROAS',         totals.roas,          prevTotals.roas],
      ['Deposits',     totals.deposits,      prevTotals.deposits],
      ['CPD',          totals.cpd,           prevTotals.cpd],
      ['Regs',         totals.registrations, prevTotals.registrations],
      ['Clicks',       totals.clicks,        prevTotals.clicks],
      ['Impressions',  totals.impressions,   prevTotals.impressions],
      ['CTR',          totals.ctr,           prevTotals.ctr],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Summary');

    const brands = [['Brand','Spend','Revenue','ROAS','Deposits','CPD','Regs','Clicks','Impressions','CTR']];
    for (const b of byBrand) brands.push([b.brand, b.spend, b.revenue, b.roas, b.deposits, b.cpd, b.registrations, b.clicks, b.impressions, b.ctr]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(brands), 'By Brand');

    const camps = [['Verdict','Brand','Campaign','Source','Status','Archived','Campaign ID','Spend','Revenue','ROAS','Impressions','Clicks','CTR','Regs','Deposits','Reg→Dep','CPD','CPA']];
    for (const c of byCampaign) {
      camps.push([c.verdict, c.brand, c.name, c.traffic_source||'', c.status||'', isArchived(c)?'YES':'', c.campaign_id||'', c.spend, c.revenue, c.roas, c.impressions, c.clicks, c.ctr, c.registrations, c.deposits, c.reg_to_dep, c.cpd, c.cpa]);
    }
    camps.push(['TOTAL', state.brand, byCampaign.length+' campaigns', '', '', '', '', totals.spend, totals.revenue, totals.roas, totals.impressions, totals.clicks, totals.ctr, totals.registrations, totals.deposits, totals.reg_to_dep, totals.cpd, totals.cpa]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(camps), 'Campaigns');

    const ser = [['Date','Spend','Revenue','ROAS','Deposits','Regs','Clicks','Impressions','CTR']];
    for (const s of series) ser.push([s.date, s.spend, s.revenue, s.roas, s.deposits, s.registrations, s.clicks, s.impressions, s.ctr]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ser), 'Daily Series');

    XLSX.writeFile(wb, 'd1ads-'+r.label.toLowerCase()+'-'+state.brand+'-' + r.from + '_to_' + r.to + '.xlsx');
  }

  function exportChannelsXlsx() {
    const ym = state.channelsMonth || DATA.endDate.slice(0,7);
    const [year, month] = ym.split('-').map(Number);
    const weeks = weeksOfMonth(year, month);
    const monthStart = ym + '-01';
    const monthEnd = weeks[weeks.length-1].to;
    const mShort = monthShort(month);
    const monthRows = rowsInRange(monthStart, monthEnd, state.brand);
    const channelSet = new Set();
    for (const r of monthRows) {
      const c = campaignById(r.creative_id);
      if (c && c.traffic_source) channelSet.add(c.traffic_source);
    }
    const channels = Array.from(channelSet).sort();
    const brandLabel = state.brand === 'ALL' ? 'ALL' : state.brand;
    const countryLabel = state.brand === 'ALL' ? 'BD,NP' : brandCountry(state.brand);
    const monthLabel = new Date(year, month-1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });

    const wb = XLSX.utils.book_new();
    const rows = [['Channel','Brand','Country','Spend (USD)','New Register','Weekly New_FTD','CPR','CPD','Reg2Dep']];
    rows.push([monthLabel]); // banner row
    for (const ch of channels) {
      let chTotals = { spend:0, registrations:0, deposits:0 };
      for (const wk of weeks) {
        const rs = rowsInRange(wk.from, wk.to, state.brand).filter(r => {
          const c = campaignById(r.creative_id);
          return c && c.traffic_source === ch;
        });
        const t = totalsOf(rs);
        rows.push([
          mShort + '_Week ' + wk.num + '_' + ch,
          brandLabel,
          countryLabel,
          t.spend,
          t.registrations,
          t.deposits,
          t.cpa,
          t.cpd,
          t.reg_to_dep,
        ]);
        chTotals.spend += t.spend;
        chTotals.registrations += t.registrations;
        chTotals.deposits += t.deposits;
      }
      const cpr = chTotals.registrations > 0 ? chTotals.spend / chTotals.registrations : null;
      const cpd = chTotals.deposits > 0 ? chTotals.spend / chTotals.deposits : null;
      const r2d = chTotals.registrations > 0 ? chTotals.deposits / chTotals.registrations : null;
      rows.push(['↳ ' + ch + ' subtotal', '—', '—', chTotals.spend, chTotals.registrations, chTotals.deposits, cpr, cpd, r2d]);
      rows.push([]); // spacer
    }
    const grand = totalsOf(monthRows);
    rows.push(['TOTAL · ' + monthLabel, brandLabel, countryLabel, grand.spend, grand.registrations, grand.deposits, grand.cpa, grand.cpd, grand.reg_to_dep]);

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Channels x Week');
    XLSX.writeFile(wb, 'd1ads-channels-' + state.brand + '-' + ym + '.xlsx');
  }
})();
